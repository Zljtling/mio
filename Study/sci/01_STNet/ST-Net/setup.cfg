[metadata]
name = stnet

[options]
zip_safe = False
packages = find:
install_requires =
  argcomplete == 3.5.3
  numpy == 1.26.4
  pandas == 1.5.3
  pyyaml == 6.0.2
  torch == 2.7.1
  torchvision == 0.22.1
  tqdm == 4.67.1
  scikit-image == 0.24.0
  scipy == 1.13.1
  matplotlib == 3.9.4
  Pillow == 9.5.0
  openslide-python == 1.4.2
  openslide-bin == 4.0.1.2
python_requires = >= 3.10, < 3.11

[options.entry_points]
console_scripts =
  stnet = stnet.main:main
